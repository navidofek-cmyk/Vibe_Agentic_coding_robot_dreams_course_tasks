services:

  # ── Claude Code ────────────────────────────────────────────────
  claude:
    build: .
    image: python-learning-assistant
    container_name: pla-claude
    stdin_open: true
    tty: true
    command: claude
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - CLAUDE_CODE_ENABLE_TELEMETRY=0
    volumes:
      - ./workspace:/workspace
      - ./.claude:/workspace/.claude:ro
      - ./CLAUDE.md:/workspace/CLAUDE.md:ro
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.claude.json:/tmp/host-claude.json:ro
    working_dir: /workspace

  # ── Codex CLI ──────────────────────────────────────────────────
  codex:
    build: .
    image: python-learning-assistant
    container_name: pla-codex
    stdin_open: true
    tty: true
    command: codex
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace

  # ── Testovací runner (bez agenta, jen pytest) ──────────────────
  tests:
    build: .
    image: python-learning-assistant
    container_name: pla-tests
    command: pytest
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace

  # ── Debug – logy do workspace/debug.log ───────────────────────
  debug:
    build: .
    image: python-learning-assistant
    container_name: pla-debug
    stdin_open: true
    tty: true
    stop_grace_period: 10s
    command: debug
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - CLAUDE_CODE_ENABLE_TELEMETRY=0
    volumes:
      - ./workspace:/workspace
      - ./.claude:/workspace/.claude:ro
      - ./CLAUDE.md:/workspace/CLAUDE.md:ro
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.claude.json:/tmp/host-claude.json:ro
    working_dir: /workspace
