[project]
name = "code-reviewer"
version = "0.1.0"
description = "Multi-Agent Code Review Supervisor using Claude Agent SDK"
requires-python = ">=3.10"
authors = [{ name = "Ivan" }]
license = { text = "MIT" }

dependencies = [
    "claude-agent-sdk>=0.1.0",
    "anyio>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
code-reviewer = "code_reviewer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring a real ANTHROPIC_API_KEY",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
